<title>Beauty World — Today's Crew</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  :root{
    --brand:#6d2e5b;--brand-ink:#4c1f40;--accent:#b8891f;--accent-soft:#f3e6c4;
    --ground:#faf6f4;--surface:#fff;--surface-2:#f4edea;--ink:#241e22;--ink-soft:#6b5f66;
    --line:#e7dcd8;--good:#1f8a52;--good-soft:#dcf1e5;--warn:#b06a12;--warn-soft:#f7e8d2;
    --shadow:0 1px 2px rgba(36,30,34,.06),0 8px 24px rgba(36,30,34,.06);--radius:14px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --brand:#d98cc4;--brand-ink:#eab6dc;--accent:#e5b64a;--accent-soft:#3a2f18;
    --ground:#171317;--surface:#211b20;--surface-2:#2a232a;--ink:#f3ebef;--ink-soft:#b6a7b0;
    --line:#392f38;--good:#55c98a;--good-soft:#17331f;--warn:#e6a24a;--warn-soft:#3a2a15;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --brand:#d98cc4;--brand-ink:#eab6dc;--accent:#e5b64a;--accent-soft:#3a2f18;
    --ground:#171317;--surface:#211b20;--surface-2:#2a232a;--ink:#f3ebef;--ink-soft:#b6a7b0;
    --line:#392f38;--good:#55c98a;--good-soft:#17331f;--warn:#e6a24a;--warn-soft:#3a2a15;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
  .wrap{max-width:620px;margin:0 auto;padding:26px 16px 64px}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(150deg,var(--brand),var(--brand-ink));
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
  h1{font-size:19px;margin:0}
  h1 small{display:block;font-weight:500;color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .controls{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  input[type=date]{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);
    border-radius:11px;padding:10px 12px;flex:1}
  .btn{border:0;border-radius:11px;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:14px;padding:10px 14px;cursor:pointer}
  .btn:hover{background:var(--brand-ink)} .btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
  .meta{font-size:12.5px;color:var(--ink-soft);margin:4px 2px 16px}
  .grid{display:grid;gap:13px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card h3{margin:0;padding:14px 16px 6px;font-size:16px}
  .card h3 .sched{font-weight:500;color:var(--ink-soft);font-size:12px}
  .shift{padding:6px 16px 14px}
  .shift + .shift{border-top:1px solid var(--line)}
  .shift .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--ink-soft);margin:8px 0 8px;display:flex;align-items:center;gap:6px}
  .who{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
  .chip .t{color:var(--ink-soft);font-weight:500;font-size:12px}
  .chip.open{background:transparent;border-style:dashed;color:var(--ink-soft);font-weight:500}
  .none{color:var(--ink-soft);font-size:13.5px;font-style:italic}
  .badge{width:34px;height:34px;border-radius:50%;display:none;place-items:center;font-size:17px}
  .statebox{text-align:center;padding:44px 20px;color:var(--ink-soft)}
  .spin{display:inline-block;width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .ignored{margin-top:18px;font-size:12px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:12px}
  .foot{margin-top:22px;text-align:center;font-size:12.5px;color:var(--ink-soft)} .foot a{color:var(--brand);text-decoration:none;font-weight:600}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<div class="wrap">
  <div class="head">
    <div class="logo">BW</div>
    <h1>Today's Crew<small>Live from Connecteam</small></h1>
  </div>

  <div class="controls">
    <input type="date" id="date" />
    <button class="btn ghost" id="todayBtn">Today</button>
    <button class="btn" id="refresh">Refresh</button>
  </div>
  <div class="meta" id="meta"></div>

  <div id="content"><div class="statebox"><div class="spin"></div></div></div>

  <p class="foot"><a href="/index.html">Task app</a> · <a href="/connection-check.html">Connection check</a></p>
</div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

  function todayISO(){
    try{ return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
    catch(e){ return new Date().toISOString().slice(0,10); }
  }

  function load() {
    var date = $("date").value || todayISO();
    $("content").innerHTML = '<div class="statebox"><div class="spin"></div></div>';
    $("meta").textContent = "";
    fetch("/api/schedule?date=" + encodeURIComponent(date), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () {
        $("content").innerHTML = '<div class="statebox">Couldn\'t reach the schedule reader. If you just deployed, give it a minute.</div>';
      });
  }

  function shiftBlock(title, icon, list) {
    var inner;
    if (!list.length) {
      inner = '<span class="none">Nobody scheduled</span>';
    } else {
      inner = '<div class="who">' + list.map(function (p) {
        return '<span class="chip' + (p.open ? " open" : "") + '">' + esc(p.name) +
          (p.start ? ' <span class="t">' + esc(p.start) + "</span>" : "") + "</span>";
      }).join("") + "</div>";
    }
    return '<div class="shift"><div class="lbl">' + icon + " " + title + "</div>" + inner + "</div>";
  }

  function render(out) {
    if (!out.ok) {
      $("content").innerHTML = '<div class="statebox">' + esc(out.error || "Something went wrong.") + "</div>";
      return;
    }
    var friendly = out.date;
    try {
      var p = out.date.split("-");
      friendly = new Date(p[0], p[1]-1, p[2]).toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
    } catch (e) {}
    $("meta").textContent = friendly + " · times shown in " + (out.timezone || "local time");

    var html = '<div class="grid">';
    out.stores.forEach(function (st) {
      html += '<div class="card"><h3>' + esc(st.store) +
        (st.schedule ? ' <span class="sched">· ' + esc(st.schedule) + "</span>" : ' <span class="sched">· no matching schedule found</span>') +
        "</h3>";
      html += shiftBlock("Morning shift", "☀️", st.morning || []);
      html += shiftBlock("Afternoon shift", "🌙", st.afternoon || []);
      html += "</div>";
    });
    html += "</div>";

    if (out.ignoredSchedules && out.ignoredSchedules.length) {
      html += '<p class="ignored">Not counted as stores: ' + out.ignoredSchedules.map(esc).join(", ") + "</p>";
    }
    if (out.debug) {
      html += '<p class="ignored">Note for setup: some shifts couldn\'t be read (fields: ' + esc((out.debug.unclassifiedShiftKeys||[]).join(", ")) + "). Send this to Claude.</p>";
    }
    $("content").innerHTML = html;
  }

  $("date").value = todayISO();
  $("todayBtn").addEventListener("click", function () { $("date").value = todayISO(); load(); });
  $("refresh").addEventListener("click", load);
  $("date").addEventListener("change", load);
  load();
</script>
